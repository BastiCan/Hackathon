AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Procesador de notas de sala (Desafio 1 - Fundacion Integra).
  1 Lambda sincrona (disparada por S3) + 5 tablas DynamoDB + 2 buckets S3 + rol IAM minimo.

Parameters:
  ModelIdSeparar:
    Type: String
    Description: Inference profile de Claude Haiku 4.5 (separar/identificar).
  ModelIdConductas:
    Type: String
    Description: Inference profile de Claude Sonnet 5 (extraer conductas).
  ModelIdEvaluar:
    Type: String
    Description: Inference profile de Claude Sonnet 5 (clasificar codigo).
  ModelIdEmbeddings:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Titan Text Embeddings V2.
  NCorridas:
    Type: Number
    Default: 3
    Description: Numero de corridas de clasificacion a consolidar.
  TopK:
    Type: Number
    Default: 8
    Description: Candidatas por conducta en el RAG.

Globals:
  Function:
    Timeout: 900
    MemorySize: 1024
    Runtime: python3.13

Resources:
  TablaJardines:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_jardin
          AttributeType: S
      KeySchema:
        - AttributeName: id_jardin
          KeyType: HASH

  TablaEducadoras:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_educadora
          AttributeType: S
        - AttributeName: id_jardin
          AttributeType: S
      KeySchema:
        - AttributeName: id_educadora
          KeyType: HASH
      GlobalSecondaryIndexes:
        # Listar educadoras de un jardin.
        - IndexName: porJardin
          KeySchema:
            - AttributeName: id_jardin
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TablaNinos:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_jardin
          AttributeType: S
        - AttributeName: id_nino
          AttributeType: S
      KeySchema:
        - AttributeName: id_jardin
          KeyType: HASH
        - AttributeName: id_nino
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Listar ninos/as de un jardin (ademas del acceso por PK id_jardin).
        - IndexName: porJardin
          KeySchema:
            - AttributeName: id_jardin
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TablaRegistros:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_captura
          AttributeType: S
        - AttributeName: sala_key
          AttributeType: S
        - AttributeName: subido_en
          AttributeType: S
      KeySchema:
        - AttributeName: id_captura
          KeyType: HASH
      GlobalSecondaryIndexes:
        # Capturas de una sala por fecha de subida.
        - IndexName: porSala
          KeySchema:
            - AttributeName: sala_key
              KeyType: HASH
            - AttributeName: subido_en
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TablaObservaciones:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id_captura
          AttributeType: S
        - AttributeName: id_obs
          AttributeType: S
        - AttributeName: id_nino
          AttributeType: S
        - AttributeName: sala_key
          AttributeType: S
        - AttributeName: orden
          AttributeType: S
      KeySchema:
        - AttributeName: id_captura
          KeyType: HASH
        - AttributeName: id_obs
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Observaciones de un/a nino/a por orden (fecha de observacion + creado_en).
        - IndexName: porNino
          KeySchema:
            - AttributeName: id_nino
              KeyType: HASH
            - AttributeName: orden
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Observaciones de una sala por orden.
        - IndexName: porSala
          KeySchema:
            - AttributeName: sala_key
              KeyType: HASH
            - AttributeName: orden
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  BucketRubrica:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Bucket de capturas con nombre FIJO (!Sub + AccountId): rompe la dependencia
  # circular entre el bucket, su notificacion y la Lambda (design.md / tech.md).
  BucketCapturas:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "integra-capturas-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ProcesarNotaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ProcesarNota
      CodeUri: src/
      Handler: handler.handler
      # Invocacion asincrona (disparo S3): a lo sumo 1 reintento ante fallo del handler.
      EventInvokeConfig:
        MaximumRetryAttempts: 1
      Environment:
        Variables:
          FUENTE_DATOS: aws
          TABLA_JARDINES: !Ref TablaJardines
          TABLA_EDUCADORAS: !Ref TablaEducadoras
          TABLA_NINOS: !Ref TablaNinos
          TABLA_REGISTROS: !Ref TablaRegistros
          TABLA_OBSERVACIONES: !Ref TablaObservaciones
          BUCKET: !Ref BucketRubrica
          BUCKET_CAPTURAS: !Sub "integra-capturas-${AWS::AccountId}"
          MODEL_ID_SEPARAR: !Ref ModelIdSeparar
          MODEL_ID_CONDUCTAS: !Ref ModelIdConductas
          MODEL_ID_EVALUAR: !Ref ModelIdEvaluar
          MODEL_ID_EMBEDDINGS: !Ref ModelIdEmbeddings
          N_CORRIDAS_EVALUAR: !Ref NCorridas
          TOP_K: !Ref TopK
          LOG_LEVEL: INFO
      Events:
        # Disparo S3: meta.json y texto.json bajo el prefijo capturas/.
        CapturaMeta:
          Type: S3
          Properties:
            Bucket: !Ref BucketCapturas
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: "capturas/"
                  - Name: suffix
                    Value: "meta.json"
        CapturaTexto:
          Type: S3
          Properties:
            Bucket: !Ref BucketCapturas
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: "capturas/"
                  - Name: suffix
                    Value: "texto.json"
      Policies:
        # Lectura de nomina (Jardines, Educadoras y Ninos; incluye sus GSI).
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt TablaJardines.Arn
                - !GetAtt TablaEducadoras.Arn
                - !Sub "${TablaEducadoras.Arn}/index/*"
                - !GetAtt TablaNinos.Arn
                - !Sub "${TablaNinos.Arn}/index/*"
        # Actualizar ultima_obs_fecha / ultimo_nivel en Ninos.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt TablaNinos.Arn
        # Estado de cada captura (Registros): upsert.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt TablaRegistros.Arn
        # Escritura de resultados (Observaciones).
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt TablaObservaciones.Arn
        # Lectura de la rubrica y embeddings en S3.
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub "${BucketRubrica.Arn}/rubrica/*"
        # Lectura de las capturas (meta.json, texto.json, original/).
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub "arn:aws:s3:::integra-capturas-${AWS::AccountId}/capturas/*"
        # Bedrock: Converse y embeddings sobre inference profiles y modelos fundacionales.
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource:
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
                - "arn:aws:bedrock:*::foundation-model/*"

Outputs:
  NombreFuncion:
    Description: Nombre de la funcion Lambda.
    Value: !Ref ProcesarNotaFunction
  NombreBucketRubrica:
    Description: Bucket S3 de la rubrica.
    Value: !Ref BucketRubrica
  NombreBucketCapturas:
    Description: Bucket S3 de las capturas (nombre fijo).
    Value: !Ref BucketCapturas
  TablaJardinesNombre:
    Value: !Ref TablaJardines
  TablaEducadorasNombre:
    Value: !Ref TablaEducadoras
  TablaNinosNombre:
    Value: !Ref TablaNinos
  TablaRegistrosNombre:
    Value: !Ref TablaRegistros
  TablaObservacionesNombre:
    Value: !Ref TablaObservaciones
