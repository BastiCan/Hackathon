ra.","Explora con interés objetos o situaciones nuevas."],oa_referencia:["IA-SC-03","IA-SC-05","IA-SC-06","IA-SC-07"]},{nivel:3,nombre:"Desarrollando",descriptor:"Nombra emociones básicas y comienza a separarse del adulto con apoyo.",conductas_observables:["Nombra alegría, pena o rabia en sí mismo o en personajes de un cuento, con ayuda.","Representa emociones con gestos o palabras en sus juegos (hace como que llora o se ríe).","Se despide de su familia con contención de la tía.","Dice su nombre y algunas características propias.","Intenta realizar solo/a prácticas de higiene o alimentación con apoyo."],oa_referencia:["IA-ME-01","IA-ME-02","IA-ME-03","IA-ME-07","IA-ME-09"]},{nivel:4,nombre:"Afianzando",descriptor:"Regula sus emociones con mediación y actúa con creciente independencia.",conductas_observables:["Acepta una estrategia del adulto para calmarse (respirar, abrazo, rincón).","Elige con quién o a qué jugar y lo comunica.","Come, se lava las manos o va al baño con mínima ayuda.","Usa objetos de forma simbólica en el juego (un bloque como teléfono)."],oa_referencia:["IA-ME-04","IA-ME-05","IA-ME-06","IA-ME-09","IA-ME-12"]},{nivel:5,nombre:"Integrando",descriptor:"Aprecia sus fortalezas, comunica logros y es autónomo/a en rutinas.",conductas_observables:['Cuenta con orgullo un logro ("¡salté solito!").',"Reconoce algo que sabe hacer bien.","Realiza rutinas de alimentación, higiene y vestimenta de forma independiente.","Identifica alimentos de celebraciones de su familia."],oa_referencia:["IA-ME-08","IA-ME-09","IA-ME-10","IA-ME-11"]},{nivel:6,nombre:"Ampliando",descriptor:"Comunica emociones, preferencias e ideas, y se relaciona con personas fuera de su grupo.",conductas_observables:["Explica qué siente y por qué ante un cuento o una situación.","Se relaciona con confianza con adultos o niños de otros cursos.","Da su opinión e ideas en conversaciones de grupo.","Cuida su higiene y vestuario por iniciativa propia."],oa_referencia:["IA-TR-01","IA-TR-02","IA-TR-03","IA-TR-05","IA-TR-09"]},{nivel:7,nombre:"Consolidando",descriptor:"Se autorregula, planifica juegos y comunica su identidad.",conductas_observables:["Se autorregula frente a la frustración considerando a los demás y las normas.","Planifica un juego o proyecto: propone, organiza materiales y hace ajustes.","Describe sus cualidades, roles (nieta/o, vecino/a) y sentido de pertenencia.","Distingue sellos o fechas de vencimiento en alimentos."],oa_referencia:["IA-TR-04","IA-TR-06","IA-TR-07","IA-TR-11"]},{nivel:8,nombre:"Profundizando",descriptor:"Evalúa sus logros, se propone metas y anticipa situaciones.",conductas_observables:["Identifica qué hizo para lograr un desafío y se propone una nueva meta.","Anticipa problemas en un juego o proyecto y propone soluciones.","Reconoce sus desafíos personales sin desanimarse.","Sostiene juegos sociodramáticos con roles y significados."],oa_referencia:["IA-TR-08","IA-TR-10","IA-TR-12","IA-TR-13"]}]},{codigo:"CC",nucleo:"Convivencia y Ciudadanía",ambito:"Desarrollo Personal y Social",niveles:[{nivel:1,nombre:"Comenzando",descriptor:"Interactúa con gestos y vocalizaciones y disfruta la cercanía de otros.",conductas_observables:["Busca la mirada o responde con sonrisas y balbuceos a pares y adultos.","Disfruta estar cerca de otros niños (los observa, se acerca).","Responde a la voz del adulto cuando se le advierte un peligro."],oa_referencia:["CC-SC-01","CC-SC-02","CC-SC-06"]},{nivel:2,nombre:"Explorando",descriptor:"Muestra interés por lo que les pasa a otros y practica normas simples.",conductas_observables:["Abraza o acaricia a un compañero que llora.","Saluda y se despide con gestos o palabras.","Se sienta a almorzar o colabora en ordenar con guía.","Se acerca y participa en celebraciones."],oa_referencia:["CC-SC-03","CC-SC-04","CC-SC-05"]},{nivel:3,nombre:"Desarrollando",descriptor:"Participa en juegos grupales y comparte con apoyo del adulto.",conductas_observables:["Juega junto a pares intercambiando juguetes con mediación.","Disfruta interactuar con personas de la comunidad que visitan el jardín.","Sigue un acuerdo simple de convivencia cuando se lo recuerdan."],oa_referencia:["CC-ME-01","CC-ME-02","CC-ME-06"]},{nivel:4,nombre:"Afianzando",descriptor:"Colabora con pares y empieza a resolver conflictos dialogando.",conductas_observables:["Ofrece ayuda a un compañero (le pasa un material, lo espera).","Ante un conflicto, dice lo que pasó y escucha al otro con apoyo del adulto.","Identifica una situación de riesgo (no correr con tijeras)."],oa_referencia:["CC-ME-03","CC-ME-05","CC-ME-07"]},{nivel:5,nombre:"Integrando",descriptor:"Distingue acciones correctas para la convivencia, sus derechos y la diversidad.",conductas_observables:["Distingue acciones que ayudan o dañan la convivencia del grupo.","Menciona algún derecho propio (a jugar, a ser escuchado).","Juega con niños y niñas de distintas características sin excluir.","Colabora en celebraciones de su familia y comunidad."],oa_referencia:["CC-ME-04","CC-ME-08","CC-ME-09","CC-ME-10"]},{nivel:6,nombre:"Ampliando",descriptor:"Participa en juegos colaborativos y muestra empatía.",conductas_observables:["Acuerda con pares cómo jugar para lograr una meta común.","Escucha y apoya a un compañero que lo está pasando mal.","Respeta normas acordadas por el grupo."],oa_referencia:["CC-TR-01","CC-TR-03","CC-TR-06"]},{nivel:7,nombre:"Consolidando",descriptor:"Resuelve conflictos de forma pacífica y ejerce sus derechos.",conductas_observables:["Resuelve un conflicto con pares sin intervención del adulto (turnos, negociar).","Pide ser escuchado/a y respeta opiniones distintas.","Identifica riesgos y propone alternativas para enfrentarlos.","Respeta turnos y acuerdos de la mayoría."],oa_referencia:["CC-TR-05","CC-TR-07","CC-TR-09","CC-TR-10"]},{nivel:8,nombre:"Profundizando",descriptor:"Comprende el impacto de sus acciones y valora la diversidad y su comunidad.",conductas_observables:["Explica cómo su decisión afectó el juego del grupo.","Valora la diversidad de personas (lenguas, culturas, géneros) y lo expresa.","Participa en acciones solidarias con su familia o comunidad.","Aprecia el significado de manifestaciones culturales de su entorno."],oa_referencia:["CC-TR-02","CC-TR-04","CC-TR-08","CC-TR-11"]}]},{codigo:"CM",nucleo:"Corporalidad y Movimiento",ambito:"Desarrollo Personal y Social",niveles:[{nivel:1,nombre:"Comenzando",descriptor:"Control postural inicial y exploración sensoriomotriz.",conductas_observables:["Se muestra relajado/a y cómodo/a al ser contenido/a.","Toma objetos con la mano y los pasa de una mano a otra.","Se mantiene sentado/a; gira o repta para alcanzar algo.","Explora partes de su cuerpo (manos, pies)."],oa_referencia:["CM-SC-01","CM-SC-02","CM-SC-04","CM-SC-05"]},{nivel:2,nombre:"Explorando",descriptor:"Desplazamiento autónomo y manipulación fina inicial.",conductas_observables:["Camina de forma autónoma y disfruta moverse libremente.","Toma objetos pequeños con pinza (índice y pulgar).","Trepa, lanza objetos o participa en rondas."],oa_referencia:["CM-SC-03","CM-SC-05","CM-SC-06","CM-SC-07"]},{nivel:3,nombre:"Desarrollando",descriptor:"Reconoce partes de su cuerpo y experimenta movimientos.",conductas_observables:["Nombra partes principales del cuerpo y su función.","Expresa al adulto cuando está cómodo/a o incómodo/a.","Experimenta saltar, correr o rodar nombrando la acción con apoyo."],oa_referencia:["CM-ME-01","CM-ME-02","CM-ME-03"]},{nivel:4,nombre:"Afianzando",descriptor:"Mayor control, equilibrio y coordinación fina.",conductas_observables:["Usa cuchara, crayones o encaja piezas con coordinación.","Mantiene el equilibrio al desplazarse en distintas direcciones.","Pide jugar con movimiento libre con frecuencia."],oa_referencia:["CM-ME-04","CM-ME-05","CM-ME-06"]},{nivel:5,nombre:"Integrando",descriptor:"Resuelve desafíos motores y usa nociones espaciales.",conductas_observables:["Esquiva obstáculos o sube escalas manteniendo el equilibrio.","Usa adelante/atrás, arriba/abajo, rápido/lento en el juego.","Manipula utensilios y juguetes con precisión creciente."],oa_referencia:["CM-ME-05","CM-ME-07","CM-ME-08"]},{nivel:6,nombre:"Ampliando",descriptor:"Cuida su cuerpo y comunica sus logros motores.",conductas_observables:["Toma iniciativa para cuidar su cuerpo (abrigarse, hidratarse).",'Comunica nuevos logros con vocabulario preciso ("salté en un pie").',"Disfruta el ejercicio habitual y lo expresa."],oa_referencia:["CM-TR-01","CM-TR-02","CM-TR-04","CM-TR-05"]},{nivel:7,nombre:"Consolidando",descriptor:"Coordinación fina y gruesa precisa.",conductas_observables:["Recorta, dibuja o ensarta con precisión.","Lanza y recibe una pelota, sigue ritmos, se desplaza en planos inclinados.","Usa nociones espaciales y temporales (al lado, entre, antes/durante/después)."],oa_referencia:["CM-TR-06","CM-TR-07","CM-TR-09"]},{nivel:8,nombre:"Profundizando",descriptor:"Conciencia corporal y habilidades de fuerza y resistencia.",conductas_observables:["Reconoce su ritmo cardíaco o respiración después del ejercicio.","Muestra lateralidad definida y control del tono corporal.","Realiza juegos de fuerza y resistencia (tirar la cuerda, transportar objetos)."],oa_referencia:["CM-TR-03","CM-TR-08"]}]},{codigo:"LV",nucleo:"Lenguaje Verbal",ambito:"Comunicación Integral",niveles:[{nivel:1,nombre:"Comenzando",descriptor:"Comunicación prelingüística.",conductas_observables:["Balbucea, vocaliza o usa gestos para expresar necesidades.","Se orienta hacia sonidos del entorno (animales, instrumentos).",'Responde con el cuerpo a mensajes simples ("ven", "dame").'],oa_referencia:["LV-SC-01","LV-SC-04","LV-SC-05"]},{nivel:2,nombre:"Explorando",descriptor:"Primeras palabras y frases simples.",conductas_observables:['Usa palabra-frase o combina palabras con gestos ("agua" señalando).',"Incorpora palabras nuevas en juegos.","Manipula libros y observa imágenes con interés.",'Responde "¿qué es?", "¿dónde está?" señalando o nombrando.'],oa_referencia:["LV-SC-02","LV-SC-03","LV-SC-06","LV-SC-07","LV-SC-08"]},{nivel:3,nombre:"Desarrollando",descriptor:"Oraciones simples y comprensión de instrucciones.",conductas_observables:['Se expresa con oraciones simples ("yo quiero jugar").',"Sigue instrucciones explícitas de uno o dos pasos.","Distingue sonidos fuertes/suaves y rápidos/lentos."],oa_referencia:["LV-ME-01","LV-ME-02","LV-ME-03"]},{nivel:4,nombre:"Afianzando",descriptor:"Amplía su vocabulario y muestra interés por los textos.",conductas_observables:["Usa palabras nuevas para contar temas de su interés.","Hace preguntas sobre el contenido de un cuento.","Reconoce logos o símbolos de su entorno."],oa_referencia:["LV-ME-04","LV-ME-05","LV-ME-07"]},{nivel:5,nombre:"Integrando",descriptor:"Comprende textos y produce signos gráficos.",conductas_observables:["Reconoce la idea central de un cuento y describe personajes.",'Produce signos gráficos con intención de "escribir".',"Conversa respetando patrones gramaticales básicos."],oa_referencia:["LV-ME-01","LV-ME-06","LV-ME-08"]},{nivel:6,nombre:"Ampliando",descriptor:"Expresión oral clara y comprensión de relatos.",conductas_observables:["Se expresa con oraciones completas y tiempos verbales adecuados.","Comprende explicaciones, relatos e instrucciones complejas.","Muestra interés por el propósito de textos escritos (receta, carta)."],oa_referencia:["LV-TR-01","LV-TR-02","LV-TR-05"]},{nivel:7,nombre:"Consolidando",descriptor:"Conciencia fonológica e inferencias.",conductas_observables:["Cuenta sílabas o identifica el sonido inicial/final de palabras.","Hace inferencias y predicciones sobre un cuento.","Usa vocabulario variado según el interlocutor."],oa_referencia:["LV-TR-03","LV-TR-04","LV-TR-06"]},{nivel:8,nombre:"Profundizando",descriptor:"Lectura y escritura emergentes.",conductas_observables:["Reconoce palabras asociando letras con sonidos.","Escribe su nombre o mensajes simples legibles.","Usa palabras o mensajes en lengua indígena o en la lengua materna de sus pares."],oa_referencia:["LV-TR-07","LV-TR-08","LV-TR-09","LV-TR-10"]}]},{codigo:"LA",nucleo:"Lenguajes Artísticos",ambito:"Comunicación Integral",niveles:[{nivel:1,nombre:"Comenzando",descriptor:"Responde a estímulos sensoriales y produce sonidos.",conductas_observables:["Responde con sonrisas, balbuceos o gestos a sonidos, colores y texturas.","Produce sonidos con su voz o golpeando objetos."],oa_referencia:["LA-SC-01","LA-SC-02"]},{nivel:2,nombre:"Explorando",descriptor:"Imita, se mueve con la música y garabatea.",conductas_observables:["Imita gestos, movimientos o sonidos.","Se mueve o baila al escuchar música, intentando seguir el ritmo.","Garabatea espontáneamente con crayones o pintura.","Muestra preferencia por una canción o imagen."],oa_referencia:["LA-SC-03","LA-SC-04","LA-SC-05","LA-SC-06"]},{nivel:3,nombre:"Desarrollando",descriptor:"Se interesa por obras artísticas y canta o se mueve con ellas.",conductas_observables:["Muestra interés por títeres, música o pinturas y describe algo de ellas.","Canta canciones y juega con instrumentos u objetos sonoros.","Expresa emociones con el cuerpo en rondas o bailes."],oa_referencia:["LA-ME-01","LA-ME-03","LA-ME-04"]},{nivel:4,nombre:"Afianzando",descriptor:"Expresa preferencias y experimenta con materiales plásticos.",conductas_observables:["Expresa preferencias sobre colores, formas o sonidos de una obra.","Experimenta con pintura, modelado o dibujo para expresar ideas."],oa_referencia:["LA-ME-02","LA-ME-05"]},{nivel:5,nombre:"Integrando",descriptor:"Combina lenguajes artísticos y dibuja figuras.",conductas_observables:["Combina lenguajes artísticos (canta y baila, dibuja y dramatiza).","Dibuja figuras cerradas y primeros esbozos de figura humana."],oa_referencia:["LA-ME-06","LA-ME-07"]},{nivel:6,nombre:"Ampliando",descriptor:"Aprecia y comenta obras propias y ajenas.",conductas_observables:["Describe y compara características de obras de distintos contextos.","Comunica sus impresiones sobre obras propias y de sus pares."],oa_referencia:["LA-TR-01","LA-TR-
